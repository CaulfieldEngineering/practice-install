<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Install Practice</title>
  <link rel="apple-touch-icon" href="icon.png" /><link rel="icon" href="icon.png" />
  <meta name="color-scheme" content="dark light" />
  <style>
    :root { --bg: #141518; --text: #e3e4e8; --muted: #9a9ea8; --faint: #62666f; --accent: #6FB7A0; --on-accent: #0f1f1a; }
    @media (prefers-color-scheme: light) { :root { --bg: #fafafa; --text: #1a1b1e; --muted: #666a73; --faint: #a0a3ab; --accent: #3f9a80; --on-accent: #ffffff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 320px; text-align: center; }
    img { display: block; margin: 0 auto 16px; border-radius: 20px; }
    h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
    p { margin: 0 0 12px; color: var(--muted); }
    .install { display: block; margin: 24px auto 20px; padding: 14px 24px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 600; text-decoration: none; }
    .meta { font-size: 13px; color: var(--faint); }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="" width="88" height="88" />
    <h1>Practice</h1>
    <p class="meta">Version 0.2.2, built 18 November 2026, 03:26 UTC</p>
    <a class="install" href="itms-services://?action=download-manifest&amp;url=https://caulfieldengineering.github.io/practice-install/manifest.plist">Install</a>
    <p>Metronome, interval routines and picking drills to play along with.</p>
  </main>
</body>
</html>
